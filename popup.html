<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YTM Floating Lyrics</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">Floating Lyrics</div>
    <div class="now" id="now">Open music.youtube.com</div>
  </header>

  <section>
    <div class="label">This tab</div>
    <div class="status" id="capStatus">—</div>
    <button class="primary" id="capBtn" disabled>Allow AI to listen to this tab</button>
    <button class="ghost" id="regenBtn" disabled>Reset AI lyrics &amp; timing for this song</button>
  </section>

  <section>
    <div class="label">Display</div>
    <label class="row"><span>Show floating lyrics</span><input type="checkbox" id="enabled"></label>
    <label class="row"><span>Get timestamps from LRCLIB</span><input type="checkbox" id="useLrclib"></label>
    <label class="row"><span>AI fallback when lyrics are missing</span><input type="checkbox" id="aiEnabled"></label>
    <label class="row"><span>Show menu only on hover</span><input type="checkbox" id="autoHide"></label>
    <label class="field"><span>Background transparency · <b id="transparencyVal"></b></span><input type="range" id="transparency" min="0" max="100" step="5"></label>
  </section>

  <section>
    <div class="label">AI</div>
    <div class="field">
      <span>Provider</span>
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="groq">Groq</option>
        <option value="gemini">Google Gemini</option>
        <option value="local">Local (OpenAI-compatible)</option>
        <option value="custom">Custom</option>
      </select>
      <div class="hint" id="providerHint"></div>
    </div>
    <div class="field"><span>Base URL</span><input id="baseUrl" spellcheck="false"></div>
    <div class="field"><span>API key</span><input id="apiKey" type="password" spellcheck="false" placeholder="Leave empty for a local server"></div>
    <div class="field"><span>Model</span><input id="model" spellcheck="false"></div>
    <div class="field"><span>Language (optional)</span><input id="language" spellcheck="false" placeholder="auto · e.g. id, en, ja"></div>
    <button class="primary" id="saveBtn">Save</button>
    <div class="hint" id="saveMsg"></div>
  </section>

  <footer>
    <span id="cacheInfo">Cache AI: –</span>
    <button class="link" id="clearBtn">Clear all</button>
  </footer>
  <div class="tip">Shortcut: Alt+Shift+L to show/hide</div>

  <script src="popup.js"></script>
</body>
</html>
